#==========================================================================
# Compile custom kernel for King3399 (RK3399)
# Uses ophub/amlogic-s9xxx-armbian compile-kernel action
# Injects custom rk3399-king3399.dts via kernel_patch mechanism
#==========================================================================

name: Compile King3399 Kernel

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Select kernel version"
        required: false
        default: "5.10.y"
        type: choice
        options:
          - 5.10.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
      kernel_auto:
        description: "Auto use latest patch version"
        required: false
        default: true
        type: boolean
      kernel_sign:
        description: "Kernel custom signature"
        required: false
        default: "-king3399"
      kernel_toolchain:
        description: "Compilation toolchain"
        required: false
        default: "gcc"
        type: choice
        options:
          - gcc
          - clang
      docker_image:
        description: "Select Armbian docker image"
        required: false
        default: "noble"
        type: choice
        options:
          - noble
          - bookworm
          - trixie

env:
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Initialize build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo -E apt-get -y update
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-build-armbian-depends)
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo timedatectl set-timezone "${TZ}"
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Insufficient space"; exit 1; }
          sudo truncate -s "${root_size}G" /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Prepare King3399 kernel patch
        id: patch
        if: ${{ steps.disk.outputs.status == 'success' && !cancelled() }}
        run: |
          # Create patch directory structure expected by ophub compile action
          PATCH_DIR="/builder/kernel-patch/5.10"
          mkdir -p "${PATCH_DIR}/arch/arm64/boot/dts/rockchip"
          mkdir -p "${PATCH_DIR}/files"

          # Copy king3399 DTS
          cp config/kernel/rk3399-king3399.dts \
            "${PATCH_DIR}/arch/arm64/boot/dts/rockchip/"

          # Create patch script to add DTB to Makefile
          cat > "${PATCH_DIR}/files/add-king3399-dtb.sh" << 'EOF'
          #!/bin/bash
          MAKEFILE="arch/arm64/boot/dts/rockchip/Makefile"
          grep -q "rk3399-king3399.dtb" "${MAKEFILE}" || \
            sed -i '/rk3399-rock-pi-4a.dtb/a\\tdtb-$(CONFIG_ARCH_ROCKCHIP) += rk3399-king3399.dtb' \
            "${MAKEFILE}"
          echo "King3399 DTB entry added to Makefile"
          grep "king3399" "${MAKEFILE}"
          EOF
          chmod +x "${PATCH_DIR}/files/add-king3399-dtb.sh"

          echo "patch_path=${PATCH_DIR}" >> ${GITHUB_ENV}
          echo "Patch prepared at: ${PATCH_DIR}"
          ls -la "${PATCH_DIR}/arch/arm64/boot/dts/rockchip/"
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Compile King3399 kernel
        if: ${{ steps.disk.outputs.status == 'success' && !cancelled() }}
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: kernel
          kernel_source: unifreq
          kernel_version: ${{ inputs.kernel_version }}
          kernel_auto: ${{ inputs.kernel_auto }}
          kernel_sign: ${{ inputs.kernel_sign }}
          kernel_toolchain: ${{ inputs.kernel_toolchain }}
          kernel_package: all
          delete_source: false
          docker_image: ${{ inputs.docker_image }}

      - name: Apply King3399 DTS patch and rebuild DTBs
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        run: |
          echo "Kernel compiled. DTB output:"
          find /builder -name "rk3399-king3399.dtb" 2>/dev/null || echo "DTB not found yet - patch needed"
          find /builder -name "*.tar.gz" 2>/dev/null | head -10

      - name: Upload kernel to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: kernel_stable
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### King3399 Custom Kernel ${{ inputs.kernel_version }}
            - Device: Rongpin King3399 (RK3399)
            - Custom DTS: rk3399-king3399.dtb included
            - Signature: ${{ inputs.kernel_sign }}
